<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem('lc.v1') || 'null');
    var t = s && s.settings && s.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app"><div class="boot"><span class="boot-mark"></span><span>Learning Center</span></div></div>

<script>

  (window.LC_GLOSSARY_FILES || []).forEach(function (f) {

  });
</script>
