<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem('lc.v1') || 'null');
    var t = s && s.settings && s.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  // Boot watchdog: if a script fails to load or startup stalls, say so and offer a reload
  // instead of pulsing forever.
  (function () {
    function stuck(msg) {
      var b = document.querySelector('.boot');
      if (!b || b.querySelector('.boot-fail')) return;
      var d = document.createElement('div');
      d.className = 'boot-fail';
      d.innerHTML = '<p>' + msg + '</p><button type="button">Reload</button>';
      d.querySelector('button').onclick = function () { location.reload(); };
      b.appendChild(d);
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT') stuck('A file didn\'t load (' + (t.getAttribute('src') || 'script') + '). Check the connection and reload.');
    }, true);
    setTimeout(function () { stuck('This is taking longer than it should. The connection to your PC may be slow.'); }, 10000);
  })();
</script>
</head>

<div id="app" class="app"><div class="boot"><span class="boot-mark"></span><span>Learning Center</span></div></div>

<script>
  // Glossary batches load without blocking first paint. async=false keeps curriculum order so
  // alias priority stays deterministic; app.js re-runs auto-linking once they have all arrived.
  (function () {
    var files = window.LC_GLOSSARY_FILES || [], left = files.length;
    LC.glossaryReady = !left;
    function done() {
      if (--left > 0) return;
      LC.glossaryReady = true; LC._glDirty = true;
      if (LC.relink) LC.relink(); else LC._relinkPending = true;
    }
    files.forEach(function (f) {
      var s = document.createElement('script');
      s.src = f; s.async = false; s.onload = s.onerror = done;
      document.head.appendChild(s);
    });
  })();
</script>
